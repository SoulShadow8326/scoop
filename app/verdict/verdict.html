<section class="report-card verdict-card">
    <div class="verdict-score-block">
        <div class="verdict-score-ring">
            <span id="verdict-score" class="verdict-score">0</span>
            <span class="verdict-score-unit">confidence</span>
        </div>
        <span id="verdict-band" class="verdict-band">Calibrating</span>
    </div>
    <div class="verdict-detail">
        <span class="verdict-eyebrow">Reading</span>
        <p id="verdict-claim" class="verdict-claim"></p>
        <div id="verdict-chips" class="chip-row verdict-chips"></div>
        <p id="verdict-ruling" class="verdict-ruling"></p>
        <div id="verdict-action" class="verdict-action"></div>
    </div>
</section>
