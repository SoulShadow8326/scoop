<section class="report-card confidence-card">
    <div class="section-head">
        <span class="section-eyebrow">Deterministic Scoring</span>
        <h2 class="section-title">Confidence Breakdown</h2>
    </div>
    <div class="confidence-metrics">
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Source authority</span><span id="conf-authority-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-authority" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Freshness</span><span id="conf-freshness-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-freshness" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Independence</span><span id="conf-independence-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-independence" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Evidence agreement</span><span id="conf-agreement-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-agreement" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Historical trust</span><span id="conf-trust-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-trust" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Context integrity</span><span id="conf-integrity-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-integrity" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Manipulation resistance</span><span id="conf-manipinv-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-manipinv" class="metric-fill"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Evidence strength</span><span id="conf-strength-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="conf-strength" class="metric-fill"></div></div>
        </div>
    </div>
</section>
