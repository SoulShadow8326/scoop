<section class="report-card manipulation-card">
    <div class="section-head">
        <span class="section-eyebrow">Forensic Linguistics</span>
        <h2 class="section-title">Emotional Framing</h2>
    </div>
    <div class="manip-risk-row">
        <span class="manip-risk-label">Manipulation risk</span>
        <span id="manip-risk" class="manip-risk-value">0</span>
    </div>
    <div class="manip-metrics">
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Fear</span><span id="manip-fear-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="manip-fear" class="metric-fill warn"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Anger</span><span id="manip-anger-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="manip-anger" class="metric-fill warn"></div></div>
        </div>
        <div class="metric">
            <div class="metric-head"><span class="metric-label">Outrage</span><span id="manip-outrage-val" class="metric-value">0</span></div>
            <div class="metric-track"><div id="manip-outrage" class="metric-fill warn"></div></div>
        </div>
    </div>
    <p class="manip-techniques-label">Techniques detected</p>
    <div id="manip-techniques" class="chip-row"></div>
</section>
