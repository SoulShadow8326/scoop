<section class="report-card courtroom-card">
    <div class="section-head">
        <span class="section-eyebrow">Adversarial Reasoning</span>
        <h2 class="section-title">Courtroom</h2>
    </div>
    <div class="courtroom-columns">
        <div class="court-col">
            <span class="court-col-tag court-tag-pros">Prosecution</span>
            <ul id="court-prosecution" class="court-list"></ul>
        </div>
        <div class="court-col">
            <span class="court-col-tag court-tag-def">Defense</span>
            <ul id="court-defense" class="court-list"></ul>
        </div>
        <div class="court-col">
            <span class="court-col-tag court-tag-cross">Cross-Examination</span>
            <ul id="court-cross" class="court-list"></ul>
        </div>
    </div>
    <div class="judge-card">
        <span class="judge-tag">Judge's Ruling</span>
        <p id="judge-ruling" class="judge-ruling"></p>
        <p id="judge-assessment" class="judge-assessment"></p>
        <div class="judge-grid">
            <div class="judge-block">
                <span class="judge-block-label">Key factors</span>
                <ul id="judge-factors" class="judge-block-list"></ul>
            </div>
            <div class="judge-block">
                <span class="judge-block-label">Dissenting considerations</span>
                <ul id="judge-dissent" class="judge-block-list"></ul>
            </div>
        </div>
        <div id="judge-action" class="judge-action"></div>
    </div>
</section>
