<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoop | Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/landing/landing.css">
    <link rel="stylesheet" href="/static/auth/auth.css">
</head>
<body>
    <main class="auth-main">
        <a href="/" class="auth-logo">Scoop</a>
        <div class="auth-card">
            <span class="auth-eyebrow" id="auth-eyebrow">Welcome back</span>
            <h1 class="auth-title" id="auth-title">Sign in to Scoop</h1>
            <p class="auth-sub" id="auth-sub">Understand a claim before you believe it.</p>

            <form id="auth-form" class="auth-form" novalidate>
                <label class="auth-field" id="name-field" hidden>
                    <span class="auth-label">Full name</span>
                    <input type="text" id="auth-name" class="auth-input" placeholder="Alex Rivera" autocomplete="name">
                </label>
                <label class="auth-field">
                    <span class="auth-label">Email</span>
                    <input type="email" id="auth-email" class="auth-input" placeholder="you@school.org" autocomplete="email" required>
                </label>
                <label class="auth-field">
                    <span class="auth-label">Password</span>
                    <input type="password" id="auth-password" class="auth-input" placeholder="Enter your password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="auth-submit" id="auth-submit">Sign in</button>
            </form>

            <div class="auth-divider"><span>or</span></div>
            <button type="button" class="auth-oauth" id="auth-google">Continue with Google</button>

            <p class="auth-switch">
                <span id="auth-switch-text">New to Scoop?</span>
                <button type="button" class="auth-switch-btn" id="auth-switch-btn">Create an account</button>
            </p>
        </div>
        <p class="auth-disclaimer">Demo environment. Credentials are not stored or verified.</p>
    </main>
    <script src="/static/auth/auth.js"></script>
</body>
</html>
